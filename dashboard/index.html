<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasty Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        #map {
            height: 100vh;
            z-index: 1;
        }
        .leaflet-pane {
            z-index: 2;
        }
        .leaflet-top, .leaflet-bottom {
            z-index: 1000;
        }
    </style>
</head>
<body class="bg-gray-100">

    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-full md:w-1/3 lg:w-1/4 bg-white shadow-lg p-6 overflow-y-auto">
            <h2 class="text-2xl font-bold mb-6 text-gray-800 border-b pb-4">Reports</h2>
            <div id="reports-list" class="space-y-4 flex flex-col-reverse">
                <!-- Reports will be injected here -->
            </div>
        </div>

        <!-- Map -->
        <div class="w-full md:w-2/3 lg:w-3/4">
            <div id="map"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        const map = L.map('map').setView([-16.4251256, -71.5340775], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const markers = [];
        const knownReportIds = new Set();

        // SSE listener
        const source = new EventSource('http://192.168.1.13:5000/stream_reports');

        source.onopen = () => console.log("[SSE] Conectado a stream_reports");
        source.onerror = (e) => console.error("[SSE] Error en la conexión:", e);

        source.onmessage = function(event) {
            
            console.log("[SSE] Evento recibido:", event.data); 
            const report = JSON.parse(event.data);
            if (knownReportIds.has(report.report_id)) return;
            knownReportIds.add(report.report_id);

            fetch(`http://192.168.1.13:5000/qr/${report.qr_id}`)
                .then(res => res.json())
                .then(qr => {
                    const lat = qr.qr_lat;
                    const lon = qr.qr_lon;
                    fetch(`http://192.168.1.10:5000/reports/${report.report_id}/reporter`)
                    .then(res => res.json())
                    .then(reporter => {
                        console.log("Reporter:", reporter.reporter_numero);
                        const numero = reporter.reporter_numero;

                    
                        const reporterInfo = document.createElement("p");
                        reporterInfo.className = "text-sm text-gray-500";
                        reporterInfo.textContent = `Reportado por: ${numero}`;
                        reportDiv.appendChild(reporterInfo);
                    });
                    const title = `Reporte ${report.report_id}`;

                    const marker = L.marker([lat, lon]).addTo(map);
                    marker.bindPopup(`<b>${title}</b>`);
                    markers.push(marker);

                    const reportDiv = document.createElement('div');
                    reportDiv.className = "report-item p-4 rounded-lg bg-gray-50 hover:bg-gray-200 cursor-pointer transition duration-300 ease-in-out shadow-sm border border-gray-200";
                    reportDiv.setAttribute('data-lat', lat);
                    reportDiv.setAttribute('data-lng', lon);
                    const statusText = report.report_status === "1" ? "Lleno" : "Vacío";
                    reportDiv.innerHTML = `
                        <h3 class="font-semibold text-lg text-gray-700">${title}</h3>
                        <p class="text-sm text-gray-500">Creado: ${new Date(report.report_created).toISOString().split('T')[0]}</p>
                        <p class="text-sm mt-1 text-gray-600">Estado: ${statusText}</p>
                    `;

                    // Agregar al principio del contenedor (último arriba)
                    const container = document.getElementById('reports-list');
                    container.prepend(reportDiv);

                    const markerIndex = markers.length - 1;
                    reportDiv.addEventListener('click', () => {
                        map.flyTo([lat, lon], 17);
                        markers[markerIndex].openPopup();
                    });
                });
        };
    </script>
</body>
</html>
